name: smart_community_safety
description: Smart Community Safety App
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State & Utils
  provider: ^6.1.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.5.1

  # Maps (NO paid API)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  permission_handler: ^11.3.1

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.4.4

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Media
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  audioplayers: ^6.1.0

  # Notifications (Geo-fencing, SOS alerts)
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Analytics charts
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/sos_alarm.mp3
